services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dealflow
      POSTGRES_PASSWORD: dealflow
      POSTGRES_DB: dealflow
    ports:
      - "5433:5432"
    volumes:
      - dealflow-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealflow -d dealflow"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    ports:
      - "3000:3000"
    # Reach Postgres through the published port. This is the same path on Docker Engine and Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://dealflow:dealflow@host.docker.internal:5433/dealflow
      AUTH_SECRET: 7f3c9a1e5b8d4c2f6a0e9d1b3c5f7a8e2d4b6c8f0a1e3d5b7c9f1a2e4d6b8c0
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      CRON_SECRET: ${CRON_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  dealflow-pg:
